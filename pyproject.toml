[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cryptonite"
version = "0.1.0"
description = "Production-grade steganography toolkit for PNG, JPEG, and MP3"
readme = "README.md"
authors = [
    { name = "sudo-void-001", email = "rajeshpattan001@gmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = [
    "steganography",
    "cryptography",
    "security",
    "AES-256",
    "adaptive-lsb",
    "jpeg-dct",
    "echo-hiding",
    "steganalysis",
    "anti-forensics"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security :: Cryptography",
]

dependencies = [
    "cryptography>=43.0.0",
    "numpy>=1.26.0",
    "Pillow>=10.4.0",
    "pydub>=0.25.1",
    "scipy>=1.13.0",
    "scikit-image>=0.23.0",
    "typer[all]>=0.12.0",
    "rich>=13.7.0",
    "streamlit>=1.35.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "black>=24.4.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "bandit[toml]>=1.7.8",
]

[project.scripts]
cryptonite = "cli.main:app"

[project.urls]
Homepage = "https://github.com/sudo-void-001/cryptonite"
Repository = "https://github.com/sudo-void-001/cryptonite.git"
Issues = "https://github.com/sudo-void-001/cryptonite/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "cli*", "api*", "ui*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --strict-markers --tb=short"

[tool.coverage.run]
source = ["core", "cli", "api", "ui"]
omit = ["tests/*", "benchmarks/*"]

[tool.coverage.report]
show_missing = true
fail_under = 80

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "UP", "S"]
ignore = ["S101"]  # Allow assert in tests

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S311", "E501"]
"cli/*"   = ["E501"]
"ui/*"    = ["E501"]
"api/*"   = ["E501", "B008", "B904"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.bandit]
exclude_dirs = ["tests", "benchmarks"]
skips = ["B101"]  # assert used
